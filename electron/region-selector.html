<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>区域截图选择器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.25);
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    .hint {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: rgba(15, 15, 46, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 24px;
      color: #e8eaf0;
      font-size: 13px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 10001;
    }
    .dim {
      position: absolute;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    .box {
      position: absolute;
      border: 2px dashed #22d3ee;
      background: rgba(34, 211, 238, 0.08);
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.3), inset 0 0 20px rgba(34, 211, 238, 0.1);
      pointer-events: none;
    }
    .size {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      padding: 3px 8px;
      background: #22d3ee;
      color: #000;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hint">拖动鼠标框选屏幕区域，按 Esc 取消</div>
  <script>
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    const { ipcRenderer } = require('electron');

    let isDragging = false;
    let startPos = null;
    let currentPos = null;
    let dimEls = [];
    let boxEl = null;

    function clearElements() {
      dimEls.forEach(el => el.remove());
      dimEls = [];
      if (boxEl) {
        boxEl.remove();
        boxEl = null;
      }
    }

    function updateSelection() {
      clearElements();
      if (!startPos || !currentPos) return;

      const left = Math.min(startPos.x, currentPos.x);
      const top = Math.min(startPos.y, currentPos.y);
      const width = Math.abs(currentPos.x - startPos.x);
      const height = Math.abs(currentPos.y - startPos.y);

      if (width < 2 || height < 2) return;

      const dims = [
        { left: 0, top: 0, width: '100%', height: `${top}px` },
        { left: 0, top: `${top}px`, width: `${left}px`, height: `${height}px` },
        { left: `${left + width}px`, top: `${top}px`, width: `calc(100% - ${left + width}px)`, height: `${height}px` },
        { left: 0, top: `${top + height}px`, width: '100%', height: `calc(100% - ${top + height}px)` },
      ];

      dims.forEach(d => {
        const el = document.createElement('div');
        el.className = 'dim';
        Object.assign(el.style, d);
        document.body.appendChild(el);
        dimEls.push(el);
      });

      boxEl = document.createElement('div');
      boxEl.className = 'box';
      Object.assign(boxEl.style, {
        left: `${left}px`,
        top: `${top}px`,
        width: `${width}px`,
        height: `${height}px`,
      });

      const sizeEl = document.createElement('span');
      sizeEl.className = 'size';
      sizeEl.textContent = `${width} × ${height}`;
      boxEl.appendChild(sizeEl);
      document.body.appendChild(boxEl);
    }

    function finishSelection() {
      if (!isDragging || !startPos || !currentPos) return;
      isDragging = false;

      const left = Math.min(startPos.x, currentPos.x);
      const top = Math.min(startPos.y, currentPos.y);
      const width = Math.abs(currentPos.x - startPos.x);
      const height = Math.abs(currentPos.y - startPos.y);

      clearElements();

      if (width < 4 || height < 4) {
        ipcRenderer.send('region-selected', null);
        return;
      }

      ipcRenderer.send('region-selected', { left, top, width, height });
    }

    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      startPos = { x: e.clientX, y: e.clientY };
      currentPos = { x: e.clientX, y: e.clientY };
      updateSelection();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      currentPos = { x: e.clientX, y: e.clientY };
      updateSelection();
    });

    document.addEventListener('mouseup', finishSelection);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        clearElements();
        ipcRenderer.send('region-selected', null);
      }
    });
  </script>
</body>
</html>
