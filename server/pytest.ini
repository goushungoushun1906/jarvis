[pytest]
# 没有这个文件时，裸跑 `pytest` 会从 rootdir 递归收集，
# 把 libs/（历史遗留的 vendored site-packages 副本，里面带 setuptools 的测试）
# 一起收进来，直接 43 个 collection error 中断。
testpaths = tests
norecursedirs = libs .git .venv .venv-fresh .venv-clean .venv-lock .venv-final node_modules build dist __pycache__

# 异步测试用 anyio 插件（项目没装 pytest-asyncio）：
# 测试里写 @pytest.mark.anyio + 自带 anyio_backend fixture。
